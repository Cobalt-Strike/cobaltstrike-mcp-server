name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install test dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run --locked python -m unittest

      - name: Compile Python modules
        run: |
          uv run --locked python -m py_compile \
            cs_mcp.py \
            cs_audit.py \
            cs_client.py \
            cs_openapi.py \
            cs_server.py \
            cs_files.py \
            cs_resources.py \
            cs_streams.py \
            tests/test_core.py \
            tests/test_openapi.py

      - name: Validate example JSON
        run: |
          uv run --locked python -m json.tool examples/claude_desktop_config/claude_desktop_config_example.json > /dev/null
          uv run --locked python -m json.tool examples/claude_desktop_config/claude_config_development.json > /dev/null
          uv run --locked python -m json.tool examples/claude_desktop_config/claude_config_production.json > /dev/null
          uv run --locked python -m json.tool examples/claude_desktop_config/claude_config_windows.json > /dev/null
